name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Quick Tunnel API base URL for this deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write runtime API config
        env:
          QUICK_TUNNEL_URL: ${{ inputs.api_base_url || vars.QUICK_TUNNEL_URL }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const value = process.env.QUICK_TUNNEL_URL?.trim() || '';
          if (value) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || !url.hostname.endsWith('.trycloudflare.com') || url.username || url.password || url.search || url.hash) {
              throw new Error('QUICK_TUNNEL_URL must be an HTTPS Quick Tunnel API base URL');
            }
          }
          writeFileSync('dist/config.json', JSON.stringify({ apiBaseUrl: value }, null, 2) + '\n');
          JS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
